[project]
name = "seeder"
version = "0.1.0"
description = "University database seeder for PostgreSQL, Redis, MongoDB, Neo4j, and OpenSearch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "asyncpg>=0.31.0",
    "faker>=40.18.0",
    "motor>=3.7.1",
    "neo4j>=6.2.0",
    "opensearch-py>=3.2.0",
    "redis>=7.4.0",
]
